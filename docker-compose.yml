services:
  postgres:
    image: postgres:16-alpine
    container_name: kladovki_db
    environment:
      POSTGRES_USER: kladovki
      POSTGRES_PASSWORD: kladovki_secret
      POSTGRES_DB: kladovki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: kladovki_adminer
    ports:
      - "8081:8080"

volumes:
  pgdata:
