<tr class="border-b last:border-0" id="row-{{.Index}}">
    <td class="px-4 py-2">
        <input type="text" name="number[]" required placeholder="A-01"
               class="w-full border border-slate-200 rounded px-2 py-1.5 text-sm focus:ring-1 focus:ring-indigo-500 outline-none">
    </td>
    <td class="px-4 py-2">
        <input type="number" name="area[]" step="0.1" min="0" required placeholder="4.5"
               class="w-full border border-slate-200 rounded px-2 py-1.5 text-sm focus:ring-1 focus:ring-indigo-500 outline-none">
    </td>
    <td class="px-4 py-2">
        <input type="number" name="floor[]" required placeholder="-1"
               class="w-full border border-slate-200 rounded px-2 py-1.5 text-sm focus:ring-1 focus:ring-indigo-500 outline-none">
    </td>
    <td class="px-4 py-2">
        <input type="number" name="entrance[]" min="1" required placeholder="1"
               class="w-full border border-slate-200 rounded px-2 py-1.5 text-sm focus:ring-1 focus:ring-indigo-500 outline-none">
    </td>
    <td class="px-2">
        <button type="button" onclick="this.closest('tr').remove()"
                class="text-red-400 hover:text-red-600 text-lg leading-none">&times;</button>
    </td>
</tr>
