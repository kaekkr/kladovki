{{define "partials/storage_drawer.html"}}
    <div id="drawer-backdrop"
         class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-end transition-opacity duration-300">
        <div class="w-full max-w-md bg-white h-full shadow-2xl flex flex-col justify-between p-6 transform transition-transform duration-300 translate-x-0 overflow-y-auto">
            <div>
                <!-- Header -->
                <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">Кладовка {{.Storage.Number}}</h2>
                        <p class="text-xs text-slate-400">ID: {{.Storage.ID}}</p>
                    </div>
                    <button type="button"
                            onclick="document.getElementById('drawer-container').innerHTML = ''"
                            class="p-2 text-slate-400 hover:text-slate-600 rounded-lg">✕</button>
                </div>
                <!-- Edit Form -->
                <form id="edit-storage-form"
                      hx-post="/admin/storages/update"
                      hx-target="#storage-row-{{.Storage.ID}}"
                      hx-swap="outerHTML"
                      class="mt-6 space-y-4">
                    <input type="hidden" name="id" value="{{.Storage.ID}}">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Номер кладовки</label>
                        <input type="text"
                               name="number"
                               value="{{.Storage.Number}}"
                               required
                               class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Площадь (м²)</label>
                            <input type="number"
                                   step="0.1"
                                   name="area"
                                   value="{{.Storage.Area}}"
                                   required
                                   class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Этаж</label>
                            <input type="number"
                                   name="floor"
                                   value="{{.Storage.Floor}}"
                                   required
                                   class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Подъезд</label>
                            <input type="number"
                                   name="entrance"
                                   value="{{.Storage.Entrance}}"
                                   required
                                   class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Статус</label>
                        <select name="status"
                                class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="available"
                                    {{if eq .Storage.Status "available"}}selected{{end}}>Свободна</option>
                            <option value="occupied" {{if eq .Storage.Status "occupied"}}selected{{end}}>Сдана</option>
                            <option value="maintenance"
                                    {{if eq .Storage.Status "maintenance"}}selected{{end}}>Обслуживание</option>
                        </select>
                    </div>
                </form>
            </div>
            <!-- Footer Actions -->
            <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                <button type="button"
                        hx-delete="/admin/storages/delete?id={{.Storage.ID}}"
                        hx-confirm="Удалить эту кладовку?"
                        hx-target="#storage-row-{{.Storage.ID}}"
                        hx-swap="outerHTML"
                        hx-on::after-request="if(event.detail.successful) document.getElementById('drawer-container').innerHTML = ''"
                        class="px-3 py-2 text-xs font-medium text-red-600 hover:bg-red-50 rounded-lg transition">
                    Удалить
                </button>
                <div class="flex gap-2">
                    <button type="button"
                            onclick="document.getElementById('drawer-container').innerHTML = ''"
                            class="px-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-600 hover:bg-slate-50">
                        Отмена
                    </button>
                    <button type="submit"
                            form="edit-storage-form"
                            onclick="setTimeout(() => document.getElementById('drawer-container').innerHTML = '', 100)"
                            class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">
                        Сохранить
                    </button>
                </div>
            </div>
        </div>
    </div>
{{end}}
