{{ define "components/landing/navbar" }}
    <nav x-data="{ mobileOpen: false }"
         class="fixed top-0 left-0 right-0 z-50 px-4 sm:px-8 py-4 bg-[#0F172A]/80 backdrop-blur-md border-b border-line">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- Logo -->
            <a href="/" class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                <span class="font-bold text-lg sm:text-xl tracking-tighter text-white">КЛАДОВКИ<span class="text-primary">.</span></span>
            </a>
            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-300">
                <a href="#features" class="hover:text-white transition-colors">Преимущества</a>
                <a href="#solutions" class="hover:text-white transition-colors">Решения</a>
                <a href="#contacts" class="hover:text-white transition-colors">Контакты</a>
            </div>
            <div class="hidden lg:flex items-center gap-4 text-xs font-mono text-gray-400">
                <span>Kaspi Pay Integration:</span>
                <span class="ticker-text text-primary font-bold">ACTIVE</span>
            </div>
            <!-- CTA & Mobile Toggle -->
            <div class="flex items-center gap-3">
                <a href="#contacts"
                   class="hidden sm:inline-flex bg-primary text-ink px-5 py-2.5 rounded-full text-sm font-bold transition-all hover:scale-105 active:scale-95">
                    Подключить ЖК
                </a>
                <!-- Mobile Menu Button -->
                <button @click="mobileOpen = !mobileOpen"
                        type="button"
                        class="md:hidden p-2 text-gray-300 hover:text-white focus:outline-none"
                        aria-label="Toggle menu">
                    <i class="fa-solid"
                       :class="mobileOpen ? 'fa-xmark text-2xl' : 'fa-bars text-xl'"></i>
                </button>
            </div>
        </div>
        <!-- Mobile Navigation Drawer -->
        <div x-show="mobileOpen"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 -translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 -translate-y-4"
             class="md:hidden pt-4 pb-6 px-2 border-t border-line/50 mt-4 flex flex-col gap-4">
            <a @click="mobileOpen = false"
               href="#features"
               class="text-gray-300 hover:text-white py-2 text-base font-medium border-b border-line/30">Преимущества</a>
            <a @click="mobileOpen = false"
               href="#solutions"
               class="text-gray-300 hover:text-white py-2 text-base font-medium border-b border-line/30">Решения</a>
            <a @click="mobileOpen = false"
               href="#contacts"
               class="text-gray-300 hover:text-white py-2 text-base font-medium border-b border-line/30">Контакты</a>
            <div class="flex items-center justify-between text-xs font-mono text-gray-400 pt-2">
                <span>Kaspi Pay Integration:</span>
                <span class="ticker-text text-primary font-bold">ACTIVE</span>
            </div>
            <a @click="mobileOpen = false"
               href="#contacts"
               class="w-full text-center bg-primary text-ink px-6 py-3 rounded-full font-bold text-sm mt-2">
                Подключить ЖК
            </a>
        </div>
    </nav>
{{ end }}
