<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <nav class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="font-bold text-xl text-indigo-600">📦 Кладовки</a>
            <span class="text-sm text-slate-600">{{.JKName}}</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="mb-6">
            <h1 class="text-2xl font-bold">Настройка кладовок</h1>
            <p class="text-slate-500 text-sm">После регистрации ЖК — пустая таблица. Заполните данные кладовок.</p>
        </div>

        <form hx-post="/admin/storages/save" hx-target="#toast-container" hx-swap="beforeend"
              class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="text-left px-4 py-3 font-medium">№ кладовки</th>
                            <th class="text-left px-4 py-3 font-medium">Площадь, м²</th>
                            <th class="text-left px-4 py-3 font-medium">Этаж</th>
                            <th class="text-left px-4 py-3 font-medium">Подъезд</th>
                            <th class="w-10"></th>
                        </tr>
                    </thead>
                    <tbody id="storages-tbody">
                        <!-- пустая таблица, строки добавляются -->
                    </tbody>
                </table>
            </div>

            <div class="p-4 border-t flex flex-wrap gap-3">
                <button type="button"
                        hx-post="/admin/storages/add-row"
                        hx-target="#storages-tbody"
                        hx-swap="beforeend"
                        class="px-4 py-2 border border-slate-300 rounded-lg text-sm hover:bg-slate-50">
                    + Добавить строку
                </button>
                <button type="submit"
                        class="ml-auto px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">
                    Сохранить кладовки
                </button>
                <a href="/admin/dashboard" class="px-4 py-2 text-sm text-slate-500 hover:text-indigo-600">
                    Перейти в панель →
                </a>
            </div>
        </form>
    </main>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
</body>
</html>
