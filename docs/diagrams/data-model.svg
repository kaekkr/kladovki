<text x="-380" y="-158" font-size="32" fill="#1e1e1e" text-anchor="start"><tspan x="-380" dy="0">Data model (PostgreSQL)</tspan></text>
<text x="12" y="36.125" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="12" dy="0">jks</tspan><tspan x="12" dy="18.75">—</tspan><tspan x="12" dy="18.75">id, name, address</tspan><tspan x="12" dy="18.75">owner_id → users</tspan></text>
<text x="392" y="41.0" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="392" dy="0">users</tspan><tspan x="392" dy="18.75">—</tspan><tspan x="392" dy="18.75">id, full_name, phone (uniq)</tspan><tspan x="392" dy="18.75">iin (uniq), email</tspan><tspan x="392" dy="18.75">password_hash, role</tspan><tspan x="392" dy="18.75">jk_id → jks</tspan><tspan x="392" dy="18.75">telegram_chat_id</tspan></text>
<text x="-368" y="36.125" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="-368" dy="0">tariffs / tariff_history</tspan><tspan x="-368" dy="18.75">—</tspan><tspan x="-368" dy="18.75">jk_id, amount (₸/month)</tspan><tspan x="-368" dy="18.75">changed_at</tspan></text>
<text x="12" y="509.375" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="12" dy="0">storages</tspan><tspan x="12" dy="18.75">—</tspan><tspan x="12" dy="18.75">id, jk_id, number</tspan><tspan x="12" dy="18.75">area, floor, entrance</tspan><tspan x="12" dy="18.75">status, locked_until</tspan><tspan x="12" dy="18.75">transfer_to_iin/_until</tspan></text>
<text x="412" y="509.375" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="412" dy="0">rentals</tspan><tspan x="412" dy="18.75">—</tspan><tspan x="412" dy="18.75">id, storage_id, user_id, jk_id</tspan><tspan x="412" dy="18.75">months, price_per_month</tspan><tspan x="412" dy="18.75">total_paid, starts_at, ends_at</tspan><tspan x="412" dy="18.75">status</tspan></text>
<text x="832" y="509.375" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="832" dy="0">payments</tspan><tspan x="832" dy="18.75">—</tspan><tspan x="832" dy="18.75">id, rental_id, user_id</tspan><tspan x="832" dy="18.75">amount, provider</tspan><tspan x="832" dy="18.75">status</tspan><tspan x="832" dy="18.75">(id = ApiPay external_order_id)</tspan></text>
<text x="832" y="257.75" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="832" dy="0">requests</tspan><tspan x="832" dy="18.75">—</tspan><tspan x="832" dy="18.75">type, status, amount</tspan><tspan x="832" dy="18.75">choice, old/new price</tspan><tspan x="832" dy="18.75">rental_id, user_id, jk_id</tspan></text>
<text x="832" y="-3.875" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="832" dy="0">notifications</tspan><tspan x="832" dy="18.75">—</tspan><tspan x="832" dy="18.75">user_id, kind, title, body</tspan><tspan x="832" dy="18.75">link, dedupe_key, read_at</tspan></text>
<text x="1252" y="-3.875" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="1252" dy="0">notification_deliveries</tspan><tspan x="1252" dy="18.75">—</tspan><tspan x="1252" dy="18.75">channel, status, attempts</tspan><tspan x="1252" dy="18.75">next_attempt_at, last_error</tspan></text>
<text x="422" y="-155.5" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="422" dy="0">telegram_link_tokens</tspan><tspan x="422" dy="18.75">—</tspan><tspan x="422" dy="18.75">token, user_id</tspan></text>
<text x="1252" y="254.5" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="1252" dy="0">leads</tspan><tspan x="1252" dy="18.75">—</tspan><tspan x="1252" dy="18.75">landing-page contacts</tspan></text>
</svg>