<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -120 1500 790" width="1500" height="790" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="-30" y="-120" width="1500" height="790.0" fill="#ffffff"/>
<rect x="0" y="0" width="250" height="80" rx="14" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<rect x="330" y="0" width="290" height="100" rx="14" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
