<text x="930" y="265" font-size="15" fill="#e03131" text-anchor="start"><tspan x="930" dy="0">Paid rentals are never expired automatically —</tspan><tspan x="930" dy="18.75">the storage stays occupied until the OSI acts.</tspan></text>
