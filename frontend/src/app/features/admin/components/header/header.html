<header
  class="h-20 border-b border-brand-line flex items-center justify-between px-8 bg-brand-bg/50 backdrop-blur-sm sticky top-0 z-40"
>
  <div class="flex items-center space-x-6">
    <div class="relative group">
      <button
        class="flex items-center space-x-3 bg-brand-surface px-4 py-2 rounded-lg border border-brand-line hover:border-brand-accent transition-colors"
      >
        <i class="fas fa-city text-brand-accent"></i>
        <span class="text-sm font-medium">ЖК Сыганак</span>
        <i class="fas fa-chevron-down text-[10px] text-brand-muted"></i>
      </button>
      <div
        class="absolute top-full left-0 mt-2 w-64 bg-brand-surface border border-brand-line rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 overflow-hidden"
      >
        <div class="p-2 border-b border-brand-line bg-brand-bg/50">
          <p class="text-[10px] uppercase tracking-widest text-brand-muted px-3 py-1">Сменить ЖК</p>
        </div>
        <div class="p-2 space-y-1">
          <a href="#" class="block px-3 py-2 text-sm rounded-lg bg-brand-line text-brand-text"
            >ЖК Сыганак</a
          >
          <a
            href="#"
            class="block px-3 py-2 text-sm rounded-lg hover:bg-brand-line text-brand-muted hover:text-brand-text transition-colors"
            >ЖК Expo</a
          >
          <a
            href="#"
            class="block px-3 py-2 text-sm rounded-lg hover:bg-brand-line text-brand-muted hover:text-brand-text transition-colors"
            >ЖК Green Park</a
          >
        </div>
      </div>
    </div>
    <div class="h-6 w-px bg-brand-line"></div>
    <div class="flex items-center space-x-2 text-xs text-brand-muted">
      <span class="w-2 h-2 bg-brand-accent rounded-full animate-pulse"></span>
      <span>Обновлено: Только что</span>
    </div>
  </div>

  <div class="flex items-center space-x-4">
    <button
      class="w-10 h-10 rounded-full border border-brand-line flex items-center justify-center hover:bg-brand-surface transition-colors relative"
    >
      <i class="fas fa-bell text-brand-muted"></i>
      <span
        class="absolute top-2 right-2 w-2 h-2 bg-brand-accent rounded-full border-2 border-brand-bg"
      ></span>
    </button>
    <button
      class="flex items-center space-x-2 bg-brand-accent hover:bg-brand-accent-hover text-brand-bg px-5 py-2 rounded-lg text-sm font-bold transition-all"
    >
      <i class="fas fa-plus"></i>
      <span>Новый договор</span>
    </button>
  </div>
</header>
