<div class="mb-10">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold tracking-tight">Мониторинг</h1>
    <div
      class="flex items-center space-x-2 bg-brand-surface p-1 rounded-lg border border-brand-line"
    >
      <button class="px-3 py-1 text-xs font-medium bg-brand-line text-brand-text rounded-md">
        Последние 30 дней
      </button>
      <button
        class="px-3 py-1 text-xs font-medium text-brand-muted hover:text-brand-text transition-colors"
      >
        Квартал
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <!-- Stat Card 1 -->
    <div
      class="bg-brand-surface p-6 rounded-2xl border border-brand-line flex flex-col justify-between"
    >
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs uppercase tracking-widest text-brand-muted font-semibold"
          >Арендовано</span
        >
        <div class="w-8 h-8 rounded-lg bg-brand-accent/10 flex items-center justify-center">
          <i class="fas fa-percentage text-brand-accent text-xs"></i>
        </div>
      </div>
      <div class="flex items-end justify-between">
        <div class="w-full">
          <p class="text-3xl font-bold">128 / 152</p>
          <div class="w-full bg-brand-bg h-1.5 rounded-full mt-3 overflow-hidden">
            <div class="bg-brand-accent h-full w-[84%]"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Stat Card 2 -->
    <div
      class="bg-brand-surface p-6 rounded-2xl border border-brand-line flex flex-col justify-between"
    >
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs uppercase tracking-widest text-brand-muted font-semibold"
          >Доход за месяц</span
        >
        <div class="w-8 h-8 rounded-lg bg-brand-accent/10 flex items-center justify-center">
          <i class="fas fa-tenge-sign text-brand-accent text-xs"></i>
        </div>
      </div>
      <div class="flex items-end justify-between">
        <div>
          <p class="text-3xl font-bold">₸ 2 560 000</p>
          <p class="text-xs text-brand-accent mt-1">
            <i class="fas fa-arrow-up mr-1"></i> 5.1%
            <span class="text-brand-muted ml-1">vs прошлый месяц</span>
          </p>
        </div>
      </div>
    </div>

    <!-- Stat Card 3 -->
    <div
      class="bg-brand-surface p-6 rounded-2xl border border-brand-line flex flex-col justify-between"
    >
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs uppercase tracking-widest text-brand-muted font-semibold"
          >Свободно</span
        >
        <div class="w-8 h-8 rounded-lg bg-brand-accent/10 flex items-center justify-center">
          <i class="fas fa-box-open text-brand-accent text-xs"></i>
        </div>
      </div>
      <div class="flex items-end justify-between">
        <div>
          <p class="text-3xl font-bold">24</p>
          <p class="text-xs text-brand-muted mt-1">готов к сдаче</p>
        </div>
      </div>
    </div>

    <!-- Stat Card 4 -->
    <div
      class="bg-brand-surface p-6 rounded-2xl border border-brand-line flex flex-col justify-between"
    >
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs uppercase tracking-widest text-brand-muted font-semibold"
          >Задолженности</span
        >
        <div class="w-8 h-8 rounded-lg bg-status-overdue/10 flex items-center justify-center">
          <i class="fas fa-exclamation-circle text-status-overdue text-xs"></i>
        </div>
      </div>
      <div class="flex items-end justify-between">
        <div>
          <p class="text-3xl font-bold text-status-overdue">4</p>
          <p class="text-xs text-brand-muted mt-1">требуют действия</p>
        </div>
        <button class="text-[10px] uppercase font-bold text-status-overdue hover:underline">
          Подробнее
        </button>
      </div>
    </div>
  </div>
</div>
