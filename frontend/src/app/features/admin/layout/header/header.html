<header
  class="h-14 lg:h-16 shrink-0 border-b border-brand-line bg-brand-bg flex items-center justify-between gap-2 px-3 lg:px-6"
>
  <div class="flex min-w-0 items-center gap-2 lg:gap-3">
    <button
      type="button"
      (click)="nav.toggle()"
      class="lg:hidden flex h-10 w-10 shrink-0 items-center justify-center rounded-md text-brand-text hover:bg-brand-elevated"
      aria-label="Открыть меню"
      aria-controls="admin-menu"
      [attr.aria-expanded]="nav.open()"
    >
      <i class="fas fa-bars"></i>
    </button>
    <div class="min-w-0">
      <p class="truncate text-[13px] font-medium text-brand-text">
        {{ currentJk()?.name ?? 'Загрузка...' }}
      </p>

      <p class="text-[11px] text-brand-subtle">Панель управления ОСИ</p>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <a
      routerLink="/admin/notifications"
      class="relative flex w-8 h-8 items-center justify-center rounded-md text-brand-muted hover:text-brand-text hover:bg-brand-elevated transition-colors"
      title="Уведомления"
    >
      <i class="fas fa-bell text-[13px]"></i>
      @if (unread() > 0) {
        <span
          class="absolute -top-0.5 -right-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-orange-500 px-1 text-[9px] font-bold text-white"
        >
          {{ unread() > 9 ? '9+' : unread() }}
        </span>
      }
    </a>
  </div>
</header>
