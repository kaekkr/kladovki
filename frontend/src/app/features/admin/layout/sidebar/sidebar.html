@if (nav.open()) {
  <div class="fixed inset-0 z-40 bg-black/50 lg:hidden" (click)="nav.close()" aria-hidden="true"></div>
}
<aside
  id="admin-menu"
  aria-label="Меню"
  class="fixed inset-y-0 left-0 z-50 w-[260px] max-w-[85vw] bg-brand-bg border-r border-brand-line flex flex-col h-full
         transition-transform duration-200 lg:static lg:z-auto lg:w-[232px] lg:max-w-none lg:shrink-0 lg:translate-x-0"
  [class.-translate-x-full]="!nav.open()"
  [class.translate-x-0]="nav.open()"
  [attr.inert]="nav.hidden() ? '' : null"
  [attr.aria-hidden]="nav.hidden() ? 'true' : null"
>
  <div class="h-16 px-5 flex items-center justify-between border-b border-brand-line">
    <a
      routerLink="/admin/dashboard"
      class="text-[15px] font-semibold tracking-tight text-brand-text"
    >
      КЛАДОВКИ<span class="text-brand-accent">.</span>
    </a>
    <button
      type="button"
      (click)="nav.close()"
      class="lg:hidden flex h-9 w-9 items-center justify-center rounded-md text-brand-muted hover:text-brand-text"
      aria-label="Закрыть меню"
    >
      <i class="fas fa-xmark"></i>
    </button>
  </div>

  <app-admin-navbar />

  <app-user-profile />
</aside>
