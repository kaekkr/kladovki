<div class="p-8 space-y-8">
  <!-- Top Bar & Actions -->
  <div
    class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-brand-line pb-6"
  >
    <div>
      <h1 class="text-2xl font-bold text-brand-text">Шахматка кладовых</h1>
      <p class="text-sm text-brand-muted">Интерактивный план и мониторинг помещений</p>
    </div>

    <!-- Actions -->
    <div class="flex items-center space-x-3">
      <button
        (click)="isBulkModalOpen.set(true)"
        class="px-4 py-2 bg-brand-surface border border-brand-line text-brand-text rounded-lg text-sm font-medium hover:bg-brand-line/40 transition-colors flex items-center space-x-2"
      >
        <span>⚡ Пакетное создание</span>
      </button>
      <button
        (click)="isCreateModalOpen.set(true)"
        class="px-4 py-2 bg-brand-accent text-brand-bg rounded-lg text-sm font-semibold hover:opacity-90 transition-opacity flex items-center space-x-2"
      >
        <span>+ Добавить кладовку</span>
      </button>
    </div>
  </div>

  <!-- Dashboard Sections -->
  <app-admin-storage-stats
    [stats]="stats()"
    [selectedStatus]="selectedStatus()"
    (statusChange)="selectedStatus.set($event)"
  />

  <app-admin-storage-chessboard
    [floors]="floors()"
    [selectedFloor]="selectedFloor()"
    [selectedStatus]="selectedStatus()"
    [searchQuery]="searchQuery()"
    [units]="filteredUnits()"
    (floorChange)="selectFloor($event)"
    (statusChange)="selectedStatus.set($event)"
    (queryChange)="searchQuery.set($event)"
    (unitSelect)="selectedUnit.set($event)"
  />

  <!-- Slide-over Drawer for Unit Details -->
  @if (selectedUnit(); as unit) {
    <app-admin-storage-drawer [unit]="unit" (close)="selectedUnit.set(null)" />
  }

  <!-- Modals -->
  @if (isCreateModalOpen()) {
    <app-admin-create-storage-modal
      (close)="isCreateModalOpen.set(false)"
      (created)="onStorageCreated($event)"
    />
  }

  @if (isBulkModalOpen()) {
    <app-admin-bulk-storage-modal
      (close)="isBulkModalOpen.set(false)"
      (created)="onBulkCreated($event)"
    />
  }
</div>
