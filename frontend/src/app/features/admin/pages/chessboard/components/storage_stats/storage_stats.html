<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
  <div
    (click)="statusChange.emit('all')"
    [class.ring-2]="selectedStatus() === 'all'"
    class="bg-brand-surface border border-brand-line p-4 rounded-xl cursor-pointer ring-brand-accent transition-all"
  >
    <p class="text-xs text-brand-muted font-medium uppercase">Всего кладовых</p>
    <p class="text-2xl font-bold text-brand-text mt-1">{{ stats().total }}</p>
  </div>

  <div
    (click)="statusChange.emit('free')"
    [class.ring-2]="selectedStatus() === 'free'"
    class="bg-brand-surface border border-brand-line p-4 rounded-xl cursor-pointer ring-emerald-500 transition-all"
  >
    <div class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
      <p class="text-xs text-brand-muted font-medium uppercase">Свободно</p>
    </div>
    <p class="text-2xl font-bold text-emerald-400 mt-1">{{ stats().free }}</p>
  </div>

  <div
    (click)="statusChange.emit('occupied')"
    [class.ring-2]="selectedStatus() === 'occupied'"
    class="bg-brand-surface border border-brand-line p-4 rounded-xl cursor-pointer ring-rose-500 transition-all"
  >
    <div class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
      <p class="text-xs text-brand-muted font-medium uppercase">Занято</p>
    </div>
    <p class="text-2xl font-bold text-rose-400 mt-1">{{ stats().occupied }}</p>
  </div>

  <div
    (click)="statusChange.emit('locked')"
    [class.ring-2]="selectedStatus() === 'locked'"
    class="bg-brand-surface border border-brand-line p-4 rounded-xl cursor-pointer ring-amber-500 transition-all"
  >
    <div class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
      <p class="text-xs text-brand-muted font-medium uppercase">Заблокировано</p>
    </div>
    <p class="text-2xl font-bold text-amber-400 mt-1">{{ stats().locked }}</p>
  </div>
</div>
