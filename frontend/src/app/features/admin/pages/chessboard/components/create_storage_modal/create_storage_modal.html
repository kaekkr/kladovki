<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div
    class="w-full max-w-md bg-brand-surface border border-brand-line rounded-2xl p-6 space-y-6 shadow-2xl"
  >
    <div class="flex items-center justify-between border-b border-brand-line pb-4">
      <h2 class="text-xl font-bold text-brand-text">Новая кладовка</h2>
      <button (click)="close.emit()" class="text-brand-muted hover:text-brand-text text-lg">
        ✕
      </button>
    </div>

    <div class="space-y-4">
      <div>
        <label class="text-xs text-brand-muted font-medium uppercase">Номер кладовки</label>
        <input
          type="text"
          [ngModel]="number()"
          (ngModelChange)="number.set($event)"
          placeholder="например, 101A"
          class="w-full bg-brand-bg border border-brand-line text-brand-text rounded-lg p-2.5 mt-1 text-sm focus:border-brand-accent outline-none"
        />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-brand-muted font-medium uppercase">Этаж</label>
          <input
            type="number"
            [ngModel]="floor()"
            (ngModelChange)="floor.set($event)"
            class="w-full bg-brand-bg border border-brand-line text-brand-text rounded-lg p-2.5 mt-1 text-sm focus:border-brand-accent outline-none"
          />
        </div>
        <div>
          <label class="text-xs text-brand-muted font-medium uppercase">Подъезд</label>
          <input
            type="number"
            [ngModel]="entrance()"
            (ngModelChange)="entrance.set($event)"
            class="w-full bg-brand-bg border border-brand-line text-brand-text rounded-lg p-2.5 mt-1 text-sm focus:border-brand-accent outline-none"
          />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-brand-muted font-medium uppercase">Площадь (м²)</label>
          <input
            type="number"
            step="0.1"
            [ngModel]="area()"
            (ngModelChange)="area.set($event)"
            class="w-full bg-brand-bg border border-brand-line text-brand-text rounded-lg p-2.5 mt-1 text-sm focus:border-brand-accent outline-none"
          />
        </div>
        <div>
          <label class="text-xs text-brand-muted font-medium uppercase">Статус</label>
          <select
            [ngModel]="status()"
            (ngModelChange)="status.set($event)"
            class="w-full bg-brand-bg border border-brand-line text-brand-text rounded-lg p-2.5 mt-1 text-sm focus:border-brand-accent outline-none"
          >
            <option value="free">Свободно</option>
            <option value="occupied">Занято</option>
            <option value="locked">Заблокировано</option>
          </select>
        </div>
      </div>
    </div>

    <div class="flex space-x-3 pt-4 border-t border-brand-line">
      <button
        (click)="close.emit()"
        class="w-1/2 bg-brand-bg text-brand-text border border-brand-line py-2.5 rounded-lg text-sm font-medium"
      >
        Отмена
      </button>
      <button
        (click)="submit()"
        class="w-1/2 bg-brand-accent text-brand-bg font-bold py-2.5 rounded-lg text-sm"
      >
        Сохранить
      </button>
    </div>
  </div>
</div>
