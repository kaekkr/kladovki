<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div
    class="w-full max-w-md bg-brand-surface border border-brand-line rounded-2xl p-6 space-y-6 shadow-2xl animate-in fade-in zoom-in-95 duration-150"
  >
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-brand-line pb-4">
      <h2 class="text-xl font-bold text-brand-text">Пакетное создание кладовых</h2>
      <button (click)="close.emit()" class="text-brand-muted hover:text-brand-text text-lg">
        ✕
      </button>
    </div>

    <!-- Form Controls -->
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-brand-muted font-medium uppercase">Начальный №</label>
          <input
            type="number"
            [ngModel]="startNum()"
            (ngModelChange)="startNum.set($event)"
            class="w-full bg-brand-bg border border-brand-line text-brand-text rounded-lg p-2.5 mt-1 text-sm focus:border-brand-accent outline-none"
          />
        </div>
        <div>
          <label class="text-xs text-brand-muted font-medium uppercase">Количество</label>
          <input
            type="number"
            [ngModel]="count()"
            (ngModelChange)="count.set($event)"
            class="w-full bg-brand-bg border border-brand-line text-brand-text rounded-lg p-2.5 mt-1 text-sm focus:border-brand-accent outline-none"
          />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-brand-muted font-medium uppercase">Этаж</label>
          <input
            type="number"
            [ngModel]="floor()"
            (ngModelChange)="floor.set($event)"
            class="w-full bg-brand-bg border border-brand-line text-brand-text rounded-lg p-2.5 mt-1 text-sm focus:border-brand-accent outline-none"
          />
        </div>
        <div>
          <label class="text-xs text-brand-muted font-medium uppercase">Подъезд</label>
          <input
            type="number"
            [ngModel]="entrance()"
            (ngModelChange)="entrance.set($event)"
            class="w-full bg-brand-bg border border-brand-line text-brand-text rounded-lg p-2.5 mt-1 text-sm focus:border-brand-accent outline-none"
          />
        </div>
      </div>

      <div>
        <label class="text-xs text-brand-muted font-medium uppercase">Площадь (м² для всех)</label>
        <input
          type="number"
          step="0.1"
          [ngModel]="area()"
          (ngModelChange)="area.set($event)"
          class="w-full bg-brand-bg border border-brand-line text-brand-text rounded-lg p-2.5 mt-1 text-sm focus:border-brand-accent outline-none"
        />
      </div>
    </div>

    <!-- Actions -->
    <div class="flex space-x-3 pt-4 border-t border-brand-line">
      <button
        (click)="close.emit()"
        class="w-1/2 bg-brand-bg text-brand-text border border-brand-line py-2.5 rounded-lg text-sm font-medium hover:bg-brand-line/40 transition-colors"
      >
        Отмена
      </button>
      <button
        (click)="submit()"
        class="w-1/2 bg-brand-accent text-brand-bg font-bold py-2.5 rounded-lg text-sm hover:opacity-90 transition-opacity"
      >
        Создать
      </button>
    </div>
  </div>
</div>
