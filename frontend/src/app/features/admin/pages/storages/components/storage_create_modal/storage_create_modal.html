<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  role="dialog"
  aria-modal="true"
>
  <!-- Backdrop -->
  <button
    type="button"
    class="absolute inset-0 bg-black/60 backdrop-blur-sm"
    aria-label="Закрыть"
    (click)="close()"
  ></button>

  <!-- Modal -->
  <div
    class="relative z-10 w-full max-w-lg overflow-hidden rounded-xl bg-brand-surface border border-brand-line shadow-2xl"
  >
    <!-- Header -->
    <div class="flex items-start justify-between px-6 py-5 border-b border-brand-line">
      <div>
        <h2 class="text-lg font-semibold text-brand-text">Добавить кладовую</h2>

        <p class="mt-1 text-sm text-brand-muted">Создание новой кладовой</p>
      </div>

      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-md text-brand-muted hover:bg-brand-elevated hover:text-brand-text transition-colors"
        (click)="close()"
      >
        ×
      </button>
    </div>

    <!-- Content -->
    <div class="px-6 py-6 space-y-5">
      <!-- Error -->
      @if (error(); as error) {
        <div
          class="rounded-lg border border-status-overdue/20 bg-status-overdue/10 px-4 py-3 text-sm text-status-overdue"
        >
          {{ error }}
        </div>
      }

      <!-- Number -->
      <div>
        <label class="block mb-2 text-xs font-medium text-brand-muted"> Номер </label>

        <input
          type="text"
          [(ngModel)]="number"
          placeholder="Например, A-101"
          class="w-full px-3 py-2 bg-brand-surface border border-brand-line rounded-md text-sm text-brand-text placeholder:text-brand-muted outline-none focus:border-brand-accent"
        />
      </div>

      <!-- Area -->
      <div>
        <label class="block mb-2 text-xs font-medium text-brand-muted"> Площадь, м² </label>

        <input
          type="number"
          min="0.01"
          step="0.01"
          [(ngModel)]="area"
          placeholder="4.5"
          class="w-full px-3 py-2 bg-brand-surface border border-brand-line rounded-md text-sm text-brand-text placeholder:text-brand-muted outline-none focus:border-brand-accent"
        />
      </div>

      <!-- Entrance / Floor -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block mb-2 text-xs font-medium text-brand-muted"> Подъезд </label>

          <input
            type="number"
            [(ngModel)]="entrance"
            placeholder="1"
            class="w-full px-3 py-2 bg-brand-surface border border-brand-line rounded-md text-sm text-brand-text placeholder:text-brand-muted outline-none focus:border-brand-accent"
          />
        </div>

        <div>
          <label class="block mb-2 text-xs font-medium text-brand-muted"> Этаж </label>

          <input
            type="number"
            [(ngModel)]="floor"
            placeholder="-1"
            class="w-full px-3 py-2 bg-brand-surface border border-brand-line rounded-md text-sm text-brand-text placeholder:text-brand-muted outline-none focus:border-brand-accent"
          />
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-brand-line">
      <button
        type="button"
        [disabled]="saving()"
        class="px-3 py-2 rounded-md text-sm text-brand-muted hover:bg-brand-elevated hover:text-brand-text transition-colors disabled:opacity-50"
        (click)="close()"
      >
        Отмена
      </button>

      <button
        type="button"
        [disabled]="saving()"
        class="px-4 py-2 rounded-md bg-brand-accent text-brand-bg text-sm font-medium hover:opacity-90 transition-opacity disabled:opacity-50"
        (click)="submit()"
      >
        {{ saving() ? 'Создание...' : 'Создать' }}
      </button>
    </div>
  </div>
</div>
