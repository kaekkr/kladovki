<header class="relative z-20 shrink-0">
  <div class="mx-auto flex h-[68px] max-w-lg items-center justify-between px-5">
    <a routerLink="/app" class="text-[15px] font-bold tracking-[-0.02em] text-brand-text">
      КЛАДОВКИ<span class="text-brand-accent">.</span>
    </a>

    <div class="flex items-center gap-2">
      <a
        routerLink="/app/notifications"
        class="relative flex h-10 w-10 items-center justify-center rounded-full border border-brand-line bg-brand-surface text-brand-muted transition hover:bg-brand-elevated hover:text-brand-text"
      >
        <i class="fas fa-bell text-[13px]"></i>

        @if (unread() > 0) {
          <span
            class="absolute -right-0.5 -top-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-brand-accent px-1 text-[9px] font-bold text-brand-bg"
          >
            {{ unread() > 9 ? '9+' : unread() }}
          </span>
        }
      </a>
      <a
        routerLink="/app/profile"
        class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-accent text-sm font-semibold text-brand-bg"
        title="Профиль"
      >
        {{ name.charAt(0).toUpperCase() }}
      </a>
    </div>
  </div>
</header>
