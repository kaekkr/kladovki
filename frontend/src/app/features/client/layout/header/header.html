<header class="relative z-20 shrink-0">
  <div class="mx-auto flex h-[68px] max-w-lg items-center justify-between px-5">
    <a routerLink="/app" class="text-[15px] font-bold tracking-[-0.02em] text-brand-text">
      КЛАДОВКИ<span class="text-brand-accent">.</span>
    </a>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-brand-line bg-brand-surface text-brand-muted transition hover:bg-brand-elevated hover:text-brand-text"
      >
        <i class="fas fa-bell text-[13px]"></i>
      </button>

      <button
        type="button"
        class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-accent text-brand-bg text-sm font-semibold"
        title="Профиль"
      >
        {{ name.charAt(0).toUpperCase() }}
      </button>
    </div>
  </div>
</header>
