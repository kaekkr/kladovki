<div class="min-h-full space-y-6">
  <!-- Header -->
  <section>
    <a
      routerLink="/app"
      class="mb-4 inline-flex items-center gap-2 text-[11px] font-medium text-brand-muted transition-colors hover:text-brand-text"
    >
      <i class="fas fa-arrow-left text-[10px]"></i>
      Главная
    </a>

    <div class="flex items-end justify-between gap-4">
      <div>
        <h1 class="text-[24px] font-semibold tracking-[-0.035em] text-brand-text">Уведомления</h1>

        <p class="mt-1 text-xs text-brand-muted">Важные события по вашей аренде</p>
      </div>

      @if (unreadCount()) {
        <button
          type="button"
          (click)="markAllAsRead()"
          class="shrink-0 text-[11px] font-medium text-brand-accent"
        >
          Прочитать все
        </button>
      }
    </div>
  </section>

  @if (!notifications().length) {
    <section class="rounded-2xl border border-brand-line bg-brand-surface p-6 text-center">
      <div
        class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-elevated text-brand-muted"
      >
        <i class="fas fa-bell-slash"></i>
      </div>

      <h2 class="mt-4 text-sm font-semibold text-brand-text">Уведомлений нет</h2>

      <p class="mx-auto mt-1 max-w-xs text-xs leading-5 text-brand-muted">
        Здесь будут появляться важные сообщения по вашим арендам.
      </p>
    </section>
  } @else {
    <section>
      <div class="space-y-2">
        @for (notification of notifications(); track notification.id) {
          <button
            type="button"
            (click)="markAsRead(notification.id)"
            class="flex w-full items-start gap-3 rounded-2xl border px-4 py-4 text-left transition-colors hover:bg-brand-elevated"
            [class.border-brand-accent/20]="!notification.read"
            [class.bg-brand-accent/[0.03]]="!notification.read"
            [class.border-brand-line]="notification.read"
            [class.bg-brand-surface]="notification.read"
          >
            <div
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl"
              [class]="typeClass(notification.type)"
            >
              <i class="fas text-xs" [class]="typeIcon(notification.type)"></i>
            </div>

            <div class="min-w-0 flex-1">
              <div class="flex items-start justify-between gap-3">
                <p class="text-xs font-semibold text-brand-text">
                  {{ notification.title }}
                </p>

                @if (!notification.read) {
                  <span class="mt-1 h-1.5 w-1.5 shrink-0 rounded-full bg-brand-accent"></span>
                }
              </div>

              <p class="mt-1 text-[11px] leading-5 text-brand-muted">
                {{ notification.message }}
              </p>

              <p class="mt-2 text-[10px] text-brand-subtle">
                {{ notification.created_at | date: 'd MMMM, HH:mm' }}
              </p>
            </div>
          </button>
        }
      </div>
    </section>
  }
</div>
