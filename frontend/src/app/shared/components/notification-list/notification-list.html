<div class="space-y-4">
  @if (unreadCount()) {
    <div class="flex justify-end">
      <button type="button" (click)="markAll()" class="text-[11px] font-medium text-brand-accent">
        Прочитать все
      </button>
    </div>
  }

  @if (loading()) {
    <div class="h-24 animate-pulse rounded-2xl bg-brand-surface"></div>
  } @else if (error()) {
    <section class="rounded-2xl border border-brand-line bg-brand-surface p-6 text-center text-xs text-status-overdue">
      Не удалось загрузить уведомления. Попробуйте позже.
    </section>
  } @else if (!items().length) {
    <section class="rounded-2xl border border-brand-line bg-brand-surface p-6 text-center">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-elevated text-brand-muted">
        <i class="fas fa-bell-slash"></i>
      </div>
      <h2 class="mt-4 text-sm font-semibold text-brand-text">Уведомлений нет</h2>
      <p class="mx-auto mt-1 max-w-xs text-xs leading-5 text-brand-muted">
        Здесь будут появляться важные сообщения по арендам.
      </p>
    </section>
  } @else {
    <div class="space-y-2">
      @for (n of items(); track n.id) {
        <button
          type="button"
          (click)="open(n)"
          class="flex w-full items-start gap-3 rounded-2xl border px-4 py-4 text-left transition-colors hover:bg-brand-elevated"
          [class.border-brand-accent/20]="!n.read"
          [class.bg-brand-accent/[0.03]]="!n.read"
          [class.border-brand-line]="n.read"
          [class.bg-brand-surface]="n.read"
        >
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl" [class]="tone(n)">
            <i class="fas text-xs" [class]="icon(n.kind)"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-3">
              <p class="text-xs font-semibold text-brand-text">{{ n.title }}</p>
              @if (!n.read) {
                <span class="mt-1 h-1.5 w-1.5 shrink-0 rounded-full bg-brand-accent"></span>
              }
            </div>
            <p class="mt-1 text-[11px] leading-5 text-brand-muted">{{ n.body }}</p>
            <p class="mt-2 text-[10px] text-brand-subtle">{{ n.created_at | date: 'd MMMM, HH:mm' }}</p>
          </div>
        </button>
      }
    </div>
  }
</div>
